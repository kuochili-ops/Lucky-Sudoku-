<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿幸數獨 2026 - 互動慶賀版</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --primary: #3b82f6;
            --secondary: #64748b;
            --error: #ef4444;
            --cell-size: clamp(35px, 10vw, 45px);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0; display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: center; }
        .screen.active { display: flex; }

        /* 遊戲介面 */
        .header { display: flex; justify-content: space-between; width: calc(var(--cell-size) * 9); margin-bottom: 10px; align-items: center; }
        .timer { font-size: 1.2rem; font-weight: bold; color: var(--secondary); font-variant-numeric: tabular-nums;}
        .sudoku-grid { display: grid; grid-template-columns: repeat(9, var(--cell-size)); border: 3px solid #1e293b; background: white; position: relative;}
        .cell { width: var(--cell-size); height: var(--cell-size); border: 0.5px solid #cbd5e1; display: flex; justify-content: center; align-items: center; font-size: calc(var(--cell-size) * 0.7); cursor: pointer; transition: background 0.1s; user-select: none;}
        .cell.fixed { background: #f1f5f9; font-weight: 800; color: #1e293b;}
        .cell.conflict { color: var(--error); background: #fee2e2;}
        .cell.selected { background: #dbeafe; outline: 3px solid var(--primary); z-index: 5;}
        .cell:nth-child(3n) { border-right: 2px solid #1e293b; }
        .cell:nth-child(9n) { border-right: 0.5px solid #cbd5e1; }
        .sudoku-grid > .cell:nth-child(n+19):nth-child(-n+27), .sudoku-grid > .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid #1e293b; }

        /* 暫停 */
        #pauseOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(148, 163, 184, 0.9); display: none; justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(4px);}
        
        /* 數字面板 */
        .number-pad { position: absolute; display: none; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 8px; background: white; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); z-index: 100; border: 1px solid #e2e8f0;}
        .pad-btn { width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; font-size: 1.2rem; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;}

        /* ===== 慶祝畫面 (新增點擊提示) ===== */
        #winScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 1000; display: none; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer; /* 提示可以點擊 */
        }

        #confettiCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .big-congrats {
            font-size: clamp(3rem, 15vw, 6rem);
            font-weight: 900;
            background: linear-gradient(to right, #ff1f1f, #ff8c00, #ffee00, #22c55e, #3b82f6, #8b5cf6, #ff1f1f);
            background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: rainbowScroll 2s linear infinite, flyIn 0.8s ease-out forwards;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
            margin: 0;
        }

        .click-hint {
            margin-top: 50px; color: #64748b; font-size: 1.1rem;
            animation: pulse 1.5s infinite; font-weight: 500;
        }

        @keyframes rainbowScroll { to { background-position: 200% center; } }
        @keyframes flyIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* ===== 排行榜 ===== */
        .rank-container { background: rgba(255,255,255,0.95); padding: 25px; border-radius: 20px; width: 85%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .rank-title { font-size: 1.6rem; color: #1e293b; margin-top: 15px; border-bottom: 3px solid var(--primary); padding-bottom: 5px; font-weight: 800;}
        .rank-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; font-variant-numeric: tabular-nums;}
        .new-record { color: #ffffff !important; background: var(--error) !important; font-weight: bold; border-radius: 8px; animation: glow 1s infinite alternate; }
        
        @keyframes glow { from { box-shadow: 0 0 5px #ef4444; } to { box-shadow: 0 0 20px #ef4444; } }
        .btn-main { background: var(--primary); color: white; border: none; padding: 14px 40px; font-size: 1.2rem; border-radius: 50px; cursor: pointer; margin-top: 25px; font-weight: 800; }
    </style>
</head>
<body>

    <div id="startScreen" class="screen active">
        <div style="text-align:center; background:white; padding:40px; border-radius:25px; box-shadow:0 10px 25px rgba(0,0,0,0.1);">
            <h1 style="font-size:2.5rem; margin-bottom:30px;">阿幸數獨 2026</h1>
            <select id="difficulty" style="padding:12px; font-size:1.1rem; width:220px; border-radius:10px; margin-bottom:30px;">
                <option value="easy">初級 (簡單)</option>
                <option value="medium" selected>中級 (普通)</option>
                <option value="hard">高級 (挑戰)</option>
            </select><br>
            <button class="btn-main" onclick="startGame()">開始挑戰</button>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div class="header">
            <div class="timer" id="timer">00:00</div>
            <button onclick="togglePause()" id="pauseBtn" style="padding:6px 18px; border-radius:8px; border:none; cursor:pointer; font-weight:bold;">暫停</button>
        </div>
        <div style="position:relative;">
            <div id="pauseOverlay"><button class="btn-main" onclick="togglePause()">繼續遊戲</button></div>
            <div class="sudoku-grid" id="grid"></div>
        </div>
        <div class="number-pad" id="numberPad">
            <div class="pad-btn" onclick="handleInput(1)">1</div><div class="pad-btn" onclick="handleInput(2)">2</div><div class="pad-btn" onclick="handleInput(3)">3</div>
            <div class="pad-btn" onclick="handleInput(4)">4</div><div class="pad-btn" onclick="handleInput(5)">5</div><div class="pad-btn" onclick="handleInput(6)">6</div>
            <div class="pad-btn" onclick="handleInput(7)">7</div><div class="pad-btn" onclick="handleInput(8)">8</div><div class="pad-btn" onclick="handleInput(9)">9</div>
            <div class="pad-btn" style="grid-column:span 3; height:35px; font-size:1rem; background:#f1f5f9;" onclick="handleInput(null)">清除</div>
        </div>
    </div>

    <div id="winScreen" onclick="showLeaderboard()">
        <canvas id="confettiCanvas"></canvas>
        <h1 class="big-congrats">恭喜完成！</h1>
        <p id="thisTime" style="font-size:2rem; font-weight:bold; color:#1e293b; margin-top:10px; z-index:10;"></p>
        <div class="click-hint">—— 點擊螢幕查看紀錄 ——</div>
    </div>

    <div id="leaderboardScreen" class="screen">
        <div class="rank-container" id="rankContent"></div>
        <button class="btn-main" onclick="location.reload()">回主選單</button>
    </div>

    <script>
        let gameState = [], fixedMask = [], selectedIdx = null;
        let timerSeconds = 0, timerInterval = null, isPaused = false;
        let currentDifficulty = 'medium';
        let latestRecordId = null;
        const HOLES = { easy: 30, medium: 45, hard: 58 };

        function startGame() {
            currentDifficulty = document.getElementById('difficulty').value;
            generatePuzzle(HOLES[currentDifficulty]);
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameScreen').classList.add('active');
            timerSeconds = 0; startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds++;
                const m = Math.floor(timerSeconds/60).toString().padStart(2, '0');
                const s = (timerSeconds%60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseOverlay').style.display = isPaused ? 'flex' : 'none';
            document.getElementById('pauseBtn').innerText = isPaused ? '恢復' : '暫停';
            if (isPaused) clearInterval(timerInterval); else startTimer();
        }

        function handleInput(num) {
            if (selectedIdx === null) return;
            gameState[selectedIdx] = num || 0;
            render();
            document.getElementById('numberPad').style.display = 'none';
            if (!gameState.includes(0) && !document.querySelector('.conflict')) win();
        }

        // --- 勝利邏輯：啟動動畫，但不自動跳轉 ---
        let confettiAnimationId = null;
        function win() {
            clearInterval(timerInterval);
            const timeStr = document.getElementById('timer').innerText;
            document.getElementById('thisTime').innerText = `耗時 ${timeStr}`;
            saveRecord(currentDifficulty, timerSeconds);
            document.getElementById('winScreen').style.display = 'flex';
            initConfetti();
        }

        // --- 跳轉排行榜 ---
        function showLeaderboard() {
            if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
            document.getElementById('winScreen').style.display = 'none';

            const records = JSON.parse(localStorage.getItem('sudoku_ranks') || '{}');
            const container = document.getElementById('rankContent');
            container.innerHTML = '<h1 style="text-align:center; color:var(--primary); margin:0;">阿幸數獨 英雄榜</h1>';

            const diffNames = { easy: '初級 (簡單)', medium: '中級 (普通)', hard: '高級 (挑戰)' };
            for (let diff in diffNames) {
                let html = `<div class="rank-title">${diffNames[diff]}</div>`;
                const diffRecords = records[diff] || [];
                if (diffRecords.length === 0) {
                    html += '<p style="color:var(--secondary); text-align:center;">尚無挑戰記錄</p>';
                } else {
                    diffRecords.forEach((r, index) => {
                        const m = Math.floor(r.time/60).toString().padStart(2, '0');
                        const s = (r.time%60).toString().padStart(2, '0');
                        const isNew = r.id === latestRecordId;
                        html += `
                            <div class="rank-item ${isNew ? 'new-record' : ''}">
                                <span>NO.${index + 1}</span>
                                <span style="font-weight:bold;">${m}:${s}</span>
                                <span style="font-size:0.8rem; opacity:0.8;">${r.date}</span>
                            </div>`;
                    });
                }
                container.innerHTML += html;
            }
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('leaderboardScreen').classList.add('active');
        }

        // --- 3D 彩帶動畫 (維持邏輯) ---
        function initConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let pieces = [];
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#4caf50', '#ffeb3b', '#ff9800'];

            for (let i = 0; i < 150; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 10 - 5,
                    speed: Math.random() * 4 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    width: Math.random() * 8 + 4,
                    height: Math.random() * 10 + 10,
                    rSpeed: Math.random() * 0.05 + 0.01,
                    rAngle: Math.random() * Math.PI * 2
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.y += p.speed; p.rAngle += p.rSpeed; p.rotation += p.rotationSpeed;
                    if (p.y > canvas.height) p.y = -20;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.scale(1, Math.sin(p.rAngle));
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.width/2, -p.height/2, p.width, p.height);
                    ctx.restore();
                });
                confettiAnimationId = requestAnimationFrame(animate);
            }
            animate();
        }

        // --- 基礎邏輯 (不變) ---
        function saveRecord(diff, seconds) {
            let records = JSON.parse(localStorage.getItem('sudoku_ranks') || '{"easy":[],"medium":[],"hard":[]}');
            const newEntry = { id: Date.now(), time: seconds, date: new Date().toLocaleDateString() };
            records[diff].push(newEntry); records[diff].sort((a, b) => a.time - b.time); records[diff] = records[diff].slice(0, 5);
            localStorage.setItem('sudoku_ranks', JSON.stringify(records));
            latestRecordId = records[diff].find(r => r.id === newEntry.id) ? newEntry.id : null;
        }

        function generatePuzzle(holes) {
            gameState = solveSudoku(Array(81).fill(0));
            fixedMask = Array(81).fill(true);
            let removed = 0;
            while (removed < holes) {
                let r = Math.floor(Math.random()*81);
                if (fixedMask[r]) { fixedMask[r]=false; gameState[r]=0; removed++; }
            }
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            gameState.forEach((val, i) => {
                const cell = document.createElement('div');
                cell.className = `cell ${fixedMask[i] ? 'fixed' : ''}`; cell.innerText = val || '';
                if (!fixedMask[i]) cell.onclick = (e) => {
                    if (isPaused) return; e.stopPropagation(); selectedIdx = i;
                    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    const rect = cell.getBoundingClientRect();
                    const pad = document.getElementById('numberPad');
                    pad.style.display = 'grid'; pad.style.left = `${Math.min(rect.left, window.innerWidth - 160)}px`; pad.style.top = `${rect.top}px`;
                }; grid.appendChild(cell);
            }); validate();
        }

        function validate() {
            const cells = document.getElementById('grid').children;
            gameState.forEach((val, i) => {
                if (!val) return;
                let r=Math.floor(i/9),c=i%9,conflict=false;
                gameState.forEach((v2, j) => {
                    if (i === j || v2 !== val) return;
                    let r2=Math.floor(j/9), c2=j%9;
                    if (r===r2 || c===c2 || (Math.floor(r/3)===Math.floor(r2/3)&&Math.floor(c/3)===Math.floor(c2/3))) conflict=true;
                }); if (conflict) cells[i].classList.add('conflict');
            });
        }

        function solveSudoku(b) {
            const isValid = (idx, n) => {
                let rr = Math.floor(idx/9), cc = idx%9;
                for (let i=0; i<9; i++) if (b[rr*9+i]===n || b[i*9+cc]===n) return false;
                let br=Math.floor(rr/3)*3, bc=Math.floor(cc/3)*3;
                for(let i=0;i<3;i++) for(let j=0;j<3;j++) if(b[(br+i)*9+bc+j]===n) return false; return true;
            };
            const rec = (idx) => {
                if (idx === 81) return true;
                let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random()-0.5);
                for (let n of nums) if (isValid(idx, n)) { b[idx]=n; if (rec(idx+1)) return true; b[idx]=0; } return false;
            }; rec(0); return b;
        }
        window.onclick = () => document.getElementById('numberPad').style.display = 'none';
    </script>
</body>
</html>
